<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gift Case</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===== БАЗОВЫЕ СТИЛИ ===== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #080a11; color: #fff; min-height: 100vh; overflow-x: hidden; user-select: none; }
.app { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 100px; }

/* ===== ШАПКА ===== */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.logo { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
.logo span { color: #7b61ff; text-shadow: 0 0 10px rgba(123,97,255,0.5); }
.balance-widget { background: #1a1f30; padding: 8px 14px; border-radius: 30px; font-weight: 800; font-size: 15px; color: #ffd700; border: 1px solid #2a3143; display: flex; align-items: center; gap: 6px; cursor: pointer; }

/* ===== ВКЛАДКИ ===== */
.tab-section { display: none; animation: fadeIn 0.3s ease; }
.tab-section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.section-title { font-size: 20px; font-weight: 900; margin-bottom: 16px; display: flex; justify-content: space-between; }

/* ===== КЕЙСЫ ===== */
.cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
.case-card { background: #1a1f30; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; position: relative; overflow: hidden; border: 1px solid #2a3143; cursor: pointer; }
.case-card:active { transform: scale(0.96); }
.case-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; border-radius: 50%; filter: blur(40px); opacity: 0.5; pointer-events: none; }
.glow-red { background: #ff4d4d; }
.glow-purple { background: #7b61ff; }
.case-visual { height: 120px; position: relative; margin-bottom: 12px; z-index: 2; display: flex; align-items: center; justify-content: center; }
.case-img { width: 80px; height: 80px; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6)); animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.case-info { z-index: 2; text-align: center; margin-top: auto; }
.case-name { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
.case-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 900; font-size: 13px; color: #fff; cursor: pointer; background: linear-gradient(90deg, #7b61ff, #5a7bff); }
.case-btn.free { background: linear-gradient(90deg, #00e676, #00b4ff); color: #000; }

/* ===== ИНВЕНТАРЬ ===== */
.inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.inv-item { aspect-ratio: 1; background: #1a1f30; border-radius: 16px; border: 1px solid #2a3143; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; cursor: pointer; }
.inv-item img { width: 50px; height: 50px; object-fit: contain; }
.inv-name { font-size: 10px; font-weight: 700; color: #8b9bb4; margin-top: 6px; text-align: center; }

/* ===== МОДАЛКИ ===== */
.modal { position: fixed; inset: 0; z-index: 1000; background: rgba(5,7,12,0.95); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 16px; }
.modal.open { display: flex; }
.modal-content { background: #1a1f30; border-radius: 24px; padding: 24px; width: 100%; max-width: 400px; text-align: center; position: relative; border: 1px solid #2a3143; }
.close-btn { position: absolute; top: 16px; right: 16px; background: #080a11; border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }

/* ===== РУЛЕТКА ===== */
.roulette-container { width: 100%; height: 180px; background: #080a11; border: 2px solid #2a3143; border-radius: 16px; overflow: hidden; position: relative; margin: 20px 0; }
.roulette-track { display: flex; height: 100%; align-items: center; transition: transform 5s cubic-bezier(0.1, 0.8, 0.2, 1); }
.roulette-item { min-width: 140px; height: 140px; margin: 0 5px; background: #1a1f30; border-radius: 16px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.roulette-item img { width: 80px; height: 80px; object-fit: contain; }
.roulette-item span { font-size: 10px; color: #8b9bb4; margin-top: 4px; }

/* ===== ЭКРАН ПОБЕДЫ ===== */
.result-icon { width: 140px; height: 140px; margin: 0 auto 20px; object-fit: contain; filter: drop-shadow(0 0 30px rgba(123,97,255,0.8)); }
.result-name { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
.result-rarity { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

/* ===== ПРОДАЖА ===== */
.sell-img { width: 120px; height: 120px; margin: 0 auto 16px; object-fit: contain; }
.sell-price-box { background: #080a11; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
.sell-row { display: flex; justify-content: space-between; font-size: 14px; color: #8b9bb4; margin-bottom: 8px; }
.sell-row.total { border-top: 1px solid #2a3143; padding-top: 12px; margin-top: 12px; color: #fff; font-weight: 800; }
.btn-primary { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 900; font-size: 16px; color: #fff; background: linear-gradient(90deg, #7b61ff, #5a7bff); cursor: pointer; }
.btn-green { background: linear-gradient(90deg, #00e676, #00b4ff); color: #000; }

/* ===== НИЖНЕЕ МЕНЮ ===== */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: rgba(8,10,17,0.95); backdrop-filter: blur(10px); border-top: 1px solid #2a3143; display: flex; justify-content: space-around; padding: 12px 16px 24px; z-index: 100; }
.nav-btn { background: none; border: none; color: #555; font-size: 10px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.nav-btn.active { color: #7b61ff; }
.nav-btn span { font-size: 22px; }

/* ===== РЕФЕРАЛКА ===== */
.ref-link-box { background: #080a11; border: 1px dashed #7b61ff; padding: 12px; border-radius: 12px; font-size: 12px; word-break: break-all; margin-bottom: 16px; color: #fff; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1a1f30; padding: 12px 24px; border-radius: 20px; font-weight: 700; border: 1px solid #2a3143; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 5000; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
</style>
</head>
<body>

<div class="app">
  <!-- Шапка -->
  <div class="header">
    <div class="logo">Gift<span>Case</span></div>
    <div class="balance-widget" onclick="openTopUp()">
      <span>⭐</span> <span id="ui-balance">0</span>
    </div>
  </div>

  <!-- Вкладка: Кейсы -->
  <div id="tab-cases" class="tab-section active">
    <div class="section-title">Бесплатные</div>
    <div class="cases-grid">
      <div class="case-card" onclick="startSpin('daily')">
        <div class="case-glow glow-red"></div>
        <div class="case-visual"><img src="https://api.changes.tg/original/Gift.png" class="case-img" onerror="this.src=''"></div>
        <div class="case-info">
          <div class="case-name">Подарок дня</div>
          <button class="case-btn free">Бесплатно</button>
        </div>
      </div>
      <div class="case-card" onclick="startSpin('nft')">
        <div class="case-glow glow-purple"></div>
        <div class="case-visual"><img src="https://api.changes.tg/original/Flamingo.png" class="case-img" onerror="this.src=''"></div>
        <div class="case-info">
          <div class="case-name">NFT-кейс</div>
          <button class="case-btn free">Бесплатно</button>
        </div>
      </div>
    </div>

    <div class="section-title">Платные</div>
    <div class="cases-grid">
      <div class="case-card" onclick="startSpin('virus')">
        <div class="case-glow glow-purple"></div>
        <div class="case-visual"><img src="https://api.changes.tg/original/Virus.png" class="case-img" onerror="this.src=''"></div>
        <div class="case-info">
          <div class="case-name">Virus Box</div>
          <button class="case-btn">⭐ 100</button>
        </div>
      </div>
      <div class="case-card" onclick="startSpin('gorilla')">
        <div class="case-glow glow-purple"></div>
        <div class="case-visual"><img src="https://api.changes.tg/original/Gorilla.png" class="case-img" onerror="this.src=''"></div>
        <div class="case-info">
          <div class="case-name">Gorilla Box</div>
          <button class="case-btn">⭐ 500</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Вкладка: Инвентарь -->
  <div id="tab-inventory" class="tab-section">
    <div class="section-title">Инвентарь <span id="ui-inv-count" style="color:#8b9bb4; font-size:14px;">0</span></div>
    <div id="inventory-container" class="inventory-grid"></div>
  </div>

  <!-- Вкладка: Рефералка -->
  <div id="tab-ref" class="tab-section">
    <div class="section-title">Приглашения</div>
    <div style="text-align: center; margin-bottom: 20px;">
      <div style="font-size: 50px; margin-bottom: 10px;">👥</div>
      <div style="font-size: 14px; color: #8b9bb4;">Пригласи 3 друзей, чтобы открыть бонусный кейс!</div>
    </div>
    <div style="background: #1a1f30; padding: 20px; border-radius: 20px; border: 1px solid #2a3143;">
      <div style="font-size: 14px; font-weight: 800; margin-bottom: 10px;">Твоя ссылка:</div>
      <div class="ref-link-box" id="ui-ref-link">Загрузка...</div>
      <button class="btn-primary" onclick="copyRefLink()">Скопировать</button>
      <div style="margin-top: 16px; font-size: 13px; color: #8b9bb4;">Приглашено друзей: <b id="ui-invites-count" style="color: #00e676;">0</b> / 3</div>
    </div>
  </div>
</div>

<!-- Нижнее меню -->
<div class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('cases', this)"><span>🎁</span>Кейсы</button>
  <button class="nav-btn" onclick="switchTab('inventory', this)"><span>🎒</span>Инвентарь</button>
  <button class="nav-btn" onclick="switchTab('ref', this)"><span>👥</span>Друзья</button>
</div>

<!-- Модалка Рулетки -->
<div class="modal" id="modal-spin">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('modal-spin')">✕</button>
    <h2 id="spin-title" style="margin-bottom: 20px;">Открытие</h2>
    <div class="roulette-container">
      <div class="roulette-track" id="spin-track"></div>
    </div>
    <button class="btn-primary" id="spin-btn" onclick="executeSpin()">Крутить</button>
  </div>
</div>

<!-- Модалка Выигрыша -->
<div class="modal" id="modal-win">
  <div class="modal-content">
    <img src="" id="win-img" class="result-icon">
    <div class="result-name" id="win-name"></div>
    <div class="result-rarity" id="win-rarity"></div>
    <button class="btn-primary" onclick="closeModal('modal-win')">Забрать</button>
  </div>
</div>

<!-- Модалка Продажи -->
<div class="modal" id="modal-sell">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('modal-sell')">✕</button>
    <img src="" id="sell-img" class="sell-img">
    <div class="result-name" id="sell-name"></div>
    <div class="sell-price-box">
      <div class="sell-row"><span>Цена:</span> <span id="sell-base"></span></div>
      <div class="sell-row"><span>Комиссия (10%):</span> <span style="color:#ff4d4d;" id="sell-comm"></span></div>
      <div class="sell-row total"><span>Получите:</span> <span id="sell-total"></span></div>
    </div>
    <button class="btn-primary btn-green" onclick="confirmSell()">Продать за <span id="sell-btn-val"></span> ⭐</button>
  </div>
</div>

<!-- Модалка Пополнения -->
<div class="modal" id="modal-topup">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('modal-topup')">✕</button>
    <h2 style="margin-bottom: 20px;">Пополнение</h2>
    <button class="btn-primary" style="margin-bottom:10px;" onclick="topUp(100)">Купить 100 ⭐</button>
    <button class="btn-primary" onclick="topUp(500)">Купить 500 ⭐</button>
  </div>
</div>

<div class="toast" id="toast">Скопировано!</div>

<script>
// ==========================================
// КОНФИГУРАЦИЯ
// ==========================================
const API_URL = 'https://gift-bot.leo-clermento-2005.workers.dev';
const BOT_NAME = 'Case_Giftsbot';

// База предметов
const GIFTS = {
  bear: { name: 'Мишка', price: 15, img: 'https://api.changes.tg/original/Bear.png', rarity: 'common', color: '#8b9bb4' },
  heart: { name: 'Сердце', price: 15, img: 'https://api.changes.tg/original/Heart.png', rarity: 'common', color: '#8b9bb4' },
  rose: { name: 'Роза', price: 25, img: 'https://api.changes.tg/original/Rose.png', rarity: 'common', color: '#8b9bb4' },
  rocket: { name: 'Ракетка', price: 50, img: 'https://api.changes.tg/original/Rocket.png', rarity: 'common', color: '#8b9bb4' },
  diamond: { name: 'Алмаз', price: 100, img: 'https://api.changes.tg/original/Diamond.png', rarity: 'rare', color: '#00b4ff' },
  icecream: { name: 'Мороженое', price: 400, img: 'https://api.changes.tg/original/IceCream.png', rarity: 'epic', color: '#b967ff' },
  lollipop: { name: 'Леденец', price: 400, img: 'https://api.changes.tg/original/LolPop.png', rarity: 'epic', color: '#b967ff' },
  pepe: { name: 'Pepe', price: 1500, img: 'https://api.changes.tg/original/PlushPepe.png', rarity: 'legendary', color: '#ffd700' },
  gorilla: { name: 'Gorilla', price: 3000, img: 'https://api.changes.tg/original/Gorilla.png', rarity: 'legendary', color: '#ffd700' }
};

const CASES = {
  daily: { name: 'Подарок дня', price: 0, pool: ['bear','rose','heart','rocket','diamond','icecream'] },
  nft: { name: 'NFT-кейс', price: 0, pool: ['diamond','icecream','lollipop','pepe'] },
  virus: { name: 'Virus Box', price: 100, pool: ['diamond','rocket','icecream','pepe'] },
  gorilla: { name: 'Gorilla Box', price: 500, pool: ['icecream','lollipop','pepe','gorilla'] }
};

// Состояние
let state = { userId: null, balance: 0, inventory: [], invites: 0, firstFreeDrop: 0 };
let currentCase = null;
let currentWinItem = null;
let selectedSellIndex = -1;
let isSpinning = false;

// ==========================================
// 1. ИНИЦИАЛИЗАЦИЯ И СВЯЗЬ С БАЗОЙ
// ==========================================
async function initApp() {
  if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    if (Telegram.WebApp.initDataUnsafe?.user) {
      state.userId = Telegram.WebApp.initDataUnsafe.user.id;
    }
  }

  if (!state.userId) {
    // Для теста в браузере, если открыто не в ТГ
    state.userId = 123456789; 
    // alert('Внимание: Вы открыли не в Telegram. Используется тестовый аккаунт.');
  }

  // Загружаем данные с сервера
  await fetchUserData();
  document.getElementById('ui-ref-link').textContent = `https://t.me/${BOT_NAME}?start=ref_${state.userId}`;
}

async function fetchUserData() {
  try {
    const res = await fetch(`${API_URL}/api/user`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: state.userId })
    });
    
    if (res.ok) {
      const user = await res.json();
      state.balance = user.balance;
      state.inventory = JSON.parse(user.inventory || '[]');
      state.invites = user.invites;
      state.firstFreeDrop = user.first_free_drop;
      updateUI();
    } else {
      showToast('Ошибка загрузки профиля');
    }
  } catch (e) {
    showToast('Сервер спит. Подождите 10 сек...');
    setTimeout(fetchUserData, 10000);
  }
}

function updateUI() {
  document.getElementById('ui-balance').textContent = state.balance;
  document.getElementById('ui-invites-count').textContent = state.invites;
  renderInventory();
}

// ==========================================
// 2. НАВИГАЦИЯ
// ==========================================
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tabId}`).classList.add('active');
  btn.classList.add('active');
}

// ==========================================
// 3. ЛОГИКА КЕЙСОВ
// ==========================================
function startSpin(caseId) {
  if (isSpinning) return;
  const c = CASES[caseId];

  if (caseId === 'daily' && state.firstFreeDrop) {
    showToast('Ты уже открыл бесплатный кейс. Пригласи друзей!');
    return;
  }

  if (state.balance < c.price) {
    showToast('Недостаточно звёзд!');
    return;
  }

  currentCase = { ...c, id: caseId };
  document.getElementById('spin-title').textContent = c.name;
  document.getElementById('spin-btn').textContent = c.price === 0 ? 'Открыть бесплатно' : `Открыть за ${c.price} ⭐`;
  
  buildRoulette(c);
  document.getElementById('modal-spin').classList.add('open');
}

function buildRoulette(c) {
  const track = document.getElementById('spin-track');
  const items = [];
  for(let i=0; i<50; i++) {
    const r = c.pool[Math.floor(Math.random() * c.pool.length)];
    items.push({ id: r, ...GIFTS[r] });
  }
  
  // Гарантированное мороженое на первый прокрут
  if (currentCase.id === 'daily' && !state.firstFreeDrop) {
    currentWinItem = { id: 'icecream', ...GIFTS['icecream'] };
  } else {
    const r = c.pool[Math.floor(Math.random() * c.pool.length)];
    currentWinItem = { id: r, ...GIFTS[r] };
  }

  items[45] = currentWinItem;

  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  
  track.innerHTML = items.map(it => `
    <div class="roulette-item">
      <img src="${it.img}" onerror="this.style.display='none'">
      <span>${it.name}</span>
    </div>
  `).join('');
}

async function executeSpin() {
  if (isSpinning) return;
  isSpinning = true;
  document.getElementById('spin-btn').disabled = true;

  const track = document.getElementById('spin-track');
  
  // Расчет остановки
  const itemWidth = 150; // 140px + 10px margin
  const winIndex = 45;
  const container = track.parentElement;
  const offset = (container.clientWidth / 2) - (winIndex * itemWidth) - (itemWidth / 2);

  track.style.transition = 'transform 4.5s cubic-bezier(0.1, 0.8, 0.2, 1)';
  track.style.transform = `translateX(${offset}px)`;

  // Списываем баланс и сохраняем в БД
  if (currentCase.price > 0) state.balance -= currentCase.price;

  try {
    await fetch(`${API_URL}/api/spin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId: state.userId,
        itemId: currentWinItem.id,
        itemName: currentWinItem.name,
        itemPrice: currentWinItem.price,
        itemRarity: currentWinItem.rarity,
        caseId: currentCase.id
      })
    });
    
    // Обновляем локально
    state.inventory.push(currentWinItem);
    if (currentCase.id === 'daily') state.firstFreeDrop = 1;
    updateUI();
  } catch(e) {
    console.log('Ошибка сохранения', e);
  }

  setTimeout(() => {
    isSpinning = false;
    document.getElementById('spin-btn').disabled = false;
    closeModal('modal-spin');
    showWin(currentWinItem);
  }, 4700);
}

function showWin(item) {
  document.getElementById('win-img').src = item.img;
  document.getElementById('win-name').textContent = item.name;
  const rar = document.getElementById('win-rarity');
  rar.textContent = item.rarity.toUpperCase();
  rar.style.color = item.color;
  document.getElementById('modal-win').classList.add('open');
}

// ==========================================
// 4. ИНВЕНТАРЬ И ПРОДАЖА
// ==========================================
function renderInventory() {
  document.getElementById('ui-inv-count').textContent = state.inventory.length;
  const el = document.getElementById('inventory-container');
  
  if (state.inventory.length === 0) {
    el.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#8b9bb4; padding:30px;">Пусто</div>';
    return;
  }

  el.innerHTML = state.inventory.map((it, i) => `
    <div class="inv-item" onclick="openSell(${i})">
      <img src="${it.img}" onerror="this.style.display='none'">
      <div class="inv-name" style="color:${it.color}">${it.name}</div>
    </div>
  `).join('');
}

function openSell(index) {
  selectedSellIndex = index;
  const item = state.inventory[index];
  
  document.getElementById('sell-img').src = item.img;
  document.getElementById('sell-name').textContent = item.name;
  
  const comm = Math.floor(item.price * 0.1);
  const total = item.price - comm;
  
  document.getElementById('sell-base').textContent = item.price + ' ⭐';
  document.getElementById('sell-comm').textContent = '-' + comm + ' ⭐';
  document.getElementById('sell-total').textContent = total + ' ⭐';
  document.getElementById('sell-btn-val').textContent = total;

  document.getElementById('modal-sell').classList.add('open');
}

async function confirmSell() {
  const item = state.inventory[selectedSellIndex];
  const comm = Math.floor(item.price * 0.1);
  const total = item.price - comm;

  // Меняем в БД
  try {
    await fetch(`${API_URL}/api/sell`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: state.userId, itemIndex: selectedSellIndex, sellPrice: total })
    });

    // Обновляем локально
    state.balance += total;
    state.inventory.splice(selectedSellIndex, 1);
    updateUI();
    closeModal('modal-sell');
    showToast('Продано!');
  } catch(e) {
    showToast('Ошибка продажи');
  }
}

// ==========================================
// 5. РЕФЕРАЛКА И ПОПОЛНЕНИЕ
// ==========================================
function copyRefLink() {
  const link = `https://t.me/${BOT_NAME}?start=ref_${state.userId}`;
  navigator.clipboard.writeText(link).then(() => {
    showToast('Ссылка скопирована!');
  });
}

function openTopUp() { document.getElementById('modal-topup').classList.add('open'); }
function topUp(amount) {
  // В будущем тут будет вызов реального API Telegram Stars
  alert('В разработке. Скоро можно будет купить звёзды!');
}

// ==========================================
// 6. ВСПОМОГАТЕЛЬНЫЕ
// ==========================================
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Запуск
document.addEventListener('DOMContentLoaded', initApp);
</script>
